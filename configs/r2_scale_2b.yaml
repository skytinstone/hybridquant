# Round 2 scale: Qwen/Qwen3.5-2B, core cells x EF off/on (EF only where state < 16) x 3 seeds x 20 docs.
model: Qwen/Qwen3.5-2B
dtype: auto
cells:
  - {kv_bits: 16, state_bits: 16}
  - {kv_bits: 4,  state_bits: 16}
  - {kv_bits: 16, state_bits: 8}
  - {kv_bits: 16, state_bits: 6}
  - {kv_bits: 16, state_bits: 4}
  - {kv_bits: 4,  state_bits: 6}
  - {kv_bits: 2,  state_bits: 8}
  - {kv_bits: 4,  state_bits: 4}
state_error_feedback: [false, true]
seeds: [0, 1, 2]
n_docs: 20
prefill: 256
decode: 256
step: 1
batch_size: 8
dataset: wikitext2
out: results/r2_scale_2b.jsonl
