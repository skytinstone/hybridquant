# Full grid for the paper: 4x3 cells x 20 docs x 3 seeds, 512 prefill + 512 decode.
# Seeds change the document sample (and SR noise if enabled). Expect hours for 4B/9B on A100.
model: Qwen/Qwen3.5-9B
dtype: auto
kv_bits: [16, 8, 4, 2]
state_bits: [16, 8, 4]
kv_group: 128
state_group: 128
state_symmetric: false
state_stochastic: false
seeds: [0, 1, 2]
n_docs: 20
prefill: 512
decode: 512
step: 1
dataset: wikitext2
out: results/grid_9b.jsonl
