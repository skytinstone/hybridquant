# Round 2 single-needle NIAH, Qwen/Qwen3.5-0.8B: contexts 4k/16k, depths 0.1..0.9 x 10 problems, greedy, non-thinking.
# Filler is WikiText-2 train joined; the needle carries a random 6-character code absent from the filler.
model: Qwen/Qwen3.5-0.8B
dtype: auto
dataset: niah
context_lens: [4096, 16384]
depths: [0.1, 0.3, 0.5, 0.7, 0.9]
n_per_depth: 10
needle_seed: 0
max_new_tokens: 32
cells:
- {kv_bits: 16, state_bits: 16}
- {kv_bits: 4, state_bits: 16}
- {kv_bits: 2, state_bits: 16}
- {kv_bits: 16, state_bits: 8}
- {kv_bits: 16, state_bits: 4}
- {kv_bits: 4, state_bits: 4}
- {kv_bits: 2, state_bits: 8}
state_error_feedback: [false, true]
seeds: [0]
batch_size: 1
out: results/r2_niah_0.8b.jsonl
